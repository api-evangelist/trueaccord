name: TrueAccord
description: >-
  TrueAccord is a digital-first, omnichannel debt collection agency that uses
  data science and machine learning to recover consumer debt with a
  consumer-friendly, self-service experience. Through its Recover API, creditors
  and debt buyers place consumers and their debts for collection and manage
  customer records — customers, their contact information (addresses, phones,
  emails), and the debts placed against them — over a simple HTTPS interface
  secured with HTTP Basic authentication (API key as username) plus an
  X-TA-CREDITOR header for multi-creditor accounts. TrueAccord also operates
  first-party collections through its Sentry Credit subsidiary and its HeartBeat
  and HumAIn platforms, and is ISO 27001 certified.
